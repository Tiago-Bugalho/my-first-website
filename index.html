<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box
        }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        div {
            background-color: aquamarine;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <h1>Conta dor</h1>
        <p>0</p>
        <button onclick="add()">Adicionar</button>
        <button onclick="dec()">Remover</button>
        <button onclick="zer()">Zerar</button>
    </div>
    <script>
        let valor = 0;
        function add() {
            valor++;
            render()
        }
        function dec() {
            valor--;
            render()
        }
        function zer() {
            valor = 0;
            render()
        }
        function render() {
            const num = document.querySelector("p").innerText = valor
        }
        render()
    </script>
</body>
</html>
